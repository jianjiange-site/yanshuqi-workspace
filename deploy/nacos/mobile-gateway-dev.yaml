# Nacos Data ID: mobile-gateway-dev.yaml
# Namespace: yanshuqi-dev | Group: DEFAULT_GROUP
server:
  port: 8080

spring:
  application:
    name: mobile-gateway
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE:dating_dev_yanshuqi}?currentSchema=gateway&stringtype=unspecified
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:1}
  flyway:
    enabled: true
    schemas: gateway
    table: flyway_history_gateway

app:
  cache:
    key-prefix: yanshuqi
  service:
    name: mobile-gateway
    redis-key-suffix: gateway
  infra:
    redis-test-key: yanshuqi:gateway:infra:ping

minio:
  endpoint: ${MINIO_ENDPOINT}
  bucket: dating-yanshuqi
  path-style-access: true

rocketmq:
  topic-prefix: yanshuqi_dev
