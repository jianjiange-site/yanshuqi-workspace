# Nacos Data ID: im-service-dev.yaml
# Namespace: yanshuqi-dev | Group: DEFAULT_GROUP
server:
  port: 8083

spring:
  application:
    name: im-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE:dating_dev_yanshuqi}?currentSchema=im_center&stringtype=unspecified
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:1}
  flyway:
    enabled: true
    schemas: im_center
    table: flyway_history_im

app:
  cache:
    key-prefix: yanshuqi
  service:
    name: im-service
    redis-key-suffix: im
  grpc:
    port: 9093
  infra:
    redis-test-key: yanshuqi:im:infra:ping

minio:
  endpoint: ${MINIO_ENDPOINT}
  bucket: dating-yanshuqi
  path-style-access: true

rocketmq:
  topic-prefix: yanshuqi_dev

openim:
  user-id-prefix: yanshuqi_
  api-base-url: ${OPENIM_API_BASE_URL}
  admin-secret: ${OPENIM_ADMIN_SECRET}