# Nacos Data ID: post-service-dev.yaml
# Namespace: yanshuqi-dev | Group: DEFAULT_GROUP
server:
  port: 8084

spring:
  application:
    name: post-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE:dating_dev_yanshuqi}?currentSchema=post_center&stringtype=unspecified
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:1}
  flyway:
    enabled: true
    schemas: post_center
    table: flyway_history_post

app:
  cache:
    key-prefix: yanshuqi
  service:
    name: post-service
    redis-key-suffix: post
  grpc:
    port: 9094
  infra:
    redis-test-key: yanshuqi:post:infra:ping

minio:
  endpoint: ${MINIO_ENDPOINT}
  bucket: dating-yanshuqi
  path-style-access: true

rocketmq:
  topic-prefix: yanshuqi_dev
