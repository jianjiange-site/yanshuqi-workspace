server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: post-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE:dating_dev_yanshuqi}?currentSchema=post_center&stringtype=unspecified
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-init-sql: SET TIME ZONE 'UTC'
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:1}
      timeout: 3s
  flyway:
    enabled: true
    schemas: post_center
    table: flyway_history_post
    baseline-on-migrate: true

app:
  cache:
    key-prefix: ${REDIS_KEY_PREFIX:yanshuqi}
  service:
    name: post-service
    redis-key-suffix: post
  grpc:
    port: 9094
  infra:
    redis-test-key: ${REDIS_KEY_PREFIX:yanshuqi}:post:infra:ping
    redis-test-ttl-seconds: 60

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:dating-yanshuqi}
  region: ${MINIO_REGION:us-east-1}
  path-style-access: ${MINIO_PATH_STYLE_ACCESS:true}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:}
  access-key: ${ROCKETMQ_ACCESS_KEY:}
  secret-key: ${ROCKETMQ_SECRET_KEY:}
  topic-prefix: ${ROCKETMQ_TOPIC_PREFIX:yanshuqi_dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true

grpc:
  server:
    port: ${POST_GRPC_PORT:9094}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: INFO