syntax = "proto3";

package com.dating.user.profile.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.dating.user.grpc.proto";
option java_outer_classname = "UserProfileServiceProto";

// 用户资料 gRPC 服务。
service UserProfileService {
  // 查询本人资料。
  rpc GetSelfProfile(GetSelfProfileRequest) returns (GetSelfProfileResponse);
  // 更新本人基础资料，不处理头像/相册。
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // 绑定头像或相册 object key，不上传文件。
  rpc BindUserPhoto(BindUserPhotoRequest) returns (BindUserPhotoResponse);
  // 查询用户照片列表。
  rpc ListUserPhotos(ListUserPhotosRequest) returns (ListUserPhotosResponse);
  // 批量查询用户基础资料，供下游服务展示。
  rpc BatchGetBasicProfiles(BatchGetBasicProfilesRequest) returns (BatchGetBasicProfilesResponse);
  // 批量查询用户推荐展示资料，不做推荐算法。
  rpc BatchGetRecommendProfiles(BatchGetRecommendProfilesRequest) returns (BatchGetRecommendProfilesResponse);
  // 批量检查用户是否可用。
  rpc CheckUserAvailable(CheckUserAvailableRequest) returns (CheckUserAvailableResponse);
  // 首次登录后补齐 onboarding 资料，返回 Swagger 风格资料视图。
  rpc UpsertOnboarding(UpsertOnboardingRequest) returns (UpsertOnboardingResponse);
  // 查询 Swagger 风格用户资料视图。
  rpc GetUserProfileView(GetUserProfileViewRequest) returns (GetUserProfileViewResponse);
  // 查询主页卡片资料，返回 HomeCardVO 风格结构（self + target UserProfileView）。
  rpc GetHomeCardProfile(GetHomeCardProfileRequest) returns (GetHomeCardProfileResponse);
}

// 用户头像上传 gRPC 服务（与 Profile 分 service 定义，Upload 边界清晰）。
service UserAvatarService {
  // 签发头像 PUT presigned URL，不落库。
  rpc PresignAvatarUpload(PresignAvatarUploadRequest) returns (PresignAvatarUploadResponse);
  // 确认头像已上传，statObject 后写入 user_photos。
  rpc ConfirmAvatarUpload(ConfirmAvatarUploadRequest) returns (ConfirmAvatarUploadResponse);
}

// 查询本人资料请求。
message GetSelfProfileRequest {
  int64 user_id = 1;
}

// 用户资料详情，不含敏感字段。
message UserProfileDetail {
  int64 user_id = 1;
  string user_type = 2;
  string account_status = 3;
  string profile_status = 4;
  string nickname = 5;
  string gender = 6;
  string birth_date = 7;
  string country_code = 8;
  string city_code = 9;
  repeated string language_codes = 10;
  string bio = 11;
  string avatar_key = 12;
  repeated string interests = 13;
  int32 profile_score = 14;
  int32 profile_completed = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}

// 查询本人资料响应。
message GetSelfProfileResponse {
  UserProfileDetail profile = 1;
}

// 更新资料请求，不包含 avatar_key。
message UpdateProfileRequest {
  int64 user_id = 1;
  string nickname = 2;
  string gender = 3;
  string birth_date = 4;
  string country_code = 5;
  string city_code = 6;
  repeated string language_codes = 7;
  string bio = 8;
  repeated string interests = 9;
  optional int32 age = 10;
  optional int32 height = 11;
  string occupation = 12;
  string education = 13;
  string location = 14;
}

// 更新资料响应。
message UpdateProfileResponse {
  UserProfileDetail profile = 1;
  bool success = 2;
}

// 绑定照片请求。
message BindUserPhotoRequest {
  int64 user_id = 1;
  string photo_type = 2;
  string object_key = 3;
  int32 sort_order = 4;
}

// 绑定照片响应。
message BindUserPhotoResponse {
  UserPhoto photo = 1;
  string avatar_key = 2;
  string profile_status = 3;
}

// 查询照片列表请求。
message ListUserPhotosRequest {
  int64 user_id = 1;
  string photo_type = 2;
}

// 查询照片列表响应。
message ListUserPhotosResponse {
  repeated UserPhoto photos = 1;
}

// 用户照片信息，仅 object key，不含完整 URL。
message UserPhoto {
  int64 photo_id = 1;
  int64 user_id = 2;
  string photo_type = 3;
  string object_key = 4;
  int32 sort_order = 5;
  string review_status = 6;
  int32 enabled = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// 批量查询基础资料请求。
message BatchGetBasicProfilesRequest {
  repeated int64 user_ids = 1;
  bool include_unavailable = 2;
}

// 批量查询基础资料响应。
message BatchGetBasicProfilesResponse {
  repeated BasicUserProfile profiles = 1;
}

// 用户基础资料，供列表/卡片展示。
message BasicUserProfile {
  int64 user_id = 1;
  string nickname = 2;
  string gender = 3;
  string city_code = 4;
  string avatar_key = 5;
  string profile_status = 6;
  string account_status = 7;
  bool available = 8;
  string unavailable_reason = 9;
}

// 批量查询推荐展示资料请求。
message BatchGetRecommendProfilesRequest {
  repeated int64 user_ids = 1;
  bool include_unavailable = 2;
}

// 批量查询推荐展示资料响应。
message BatchGetRecommendProfilesResponse {
  repeated RecommendUserProfile profiles = 1;
}

// 用户推荐展示资料，不含敏感字段。
message RecommendUserProfile {
  int64 user_id = 1;
  string user_type = 2;
  string gender = 3;
  string birth_date = 4;
  string country_code = 5;
  string city_code = 6;
  repeated string language_codes = 7;
  repeated string interests = 8;
  string bio = 9;
  string avatar_key = 10;
  int32 profile_score = 11;
  int32 profile_completed = 12;
  string profile_status = 13;
  string account_status = 14;
  bool available = 15;
  string unavailable_reason = 16;
}

// 批量检查用户可用性请求。
message CheckUserAvailableRequest {
  repeated int64 user_ids = 1;
}

// 批量检查用户可用性响应。
message CheckUserAvailableResponse {
  repeated UserAvailableResult results = 1;
}

// 单个用户可用性结果。
message UserAvailableResult {
  int64 user_id = 1;
  bool available = 2;
  string account_status = 3;
  string profile_status = 4;
  string reason = 5;
}

// Swagger 风格头像视图，本阶段仅临时映射 avatar_key。
message AvatarView {
  string original_key = 1;
  string min_key = 2;
  string mid_key = 3;
  int32 width = 4;
  int32 height = 5;
}

// Swagger UserProfileVO 风格资料视图。
message UserProfileView {
  int64 user_id = 1;
  string nickname = 2;
  int32 age = 3;
  string gender = 4;
  int32 height = 5;
  string bio = 6;
  string occupation = 7;
  string education = 8;
  string location = 9;
  string birthday = 10;
  AvatarView avatar = 11;
  repeated string interests = 12;
  bool pending = 13;
  int32 regulation_status = 14;
  int64 last_open_at_ms = 15;
}

// Onboarding 补齐资料请求。
message UpsertOnboardingRequest {
  int64 user_id = 1;
  string nickname = 2;
  string gender = 3;
  string birthday = 4;
  optional int32 age = 5;
  optional int32 height = 6;
  string bio = 7;
  string occupation = 8;
  string education = 9;
  string location = 10;
  string default_avatar_object_key = 11;
}

// Onboarding 响应。
message UpsertOnboardingResponse {
  UserProfileView profile = 1;
}

// 查询资料视图请求。
message GetUserProfileViewRequest {
  int64 user_id = 1;
}

// 查询资料视图响应。
message GetUserProfileViewResponse {
  UserProfileView profile = 1;
}

// 主页卡片查询请求，对应 Swagger GET /api/v1/home/card?targetId=xxx。
message GetHomeCardProfileRequest {
  int64 self_user_id = 1;
  int64 target_user_id = 2;
}

// 主页卡片查询响应，对应 Swagger HomeCardVO。
message GetHomeCardProfileResponse {
  int64 self_user_id = 1;
  UserProfileView target_profile = 2;
}

// 头像 presign 请求，对应 Swagger PresignAvatarReq。
message PresignAvatarUploadRequest {
  int64 user_id = 1;
  string ext = 2;
  int64 expected_size_bytes = 3;
}

// 头像 presign 响应，对应 Swagger PresignAvatarUploadVO。
message PresignAvatarUploadResponse {
  string presigned_url = 1;
  string object_key = 2;
  int64 expires_at_ms = 3;
}

// 头像 confirm 请求。
message ConfirmAvatarUploadRequest {
  int64 user_id = 1;
  string object_key = 2;
}

// 头像 confirm 响应。
message ConfirmAvatarUploadResponse {
  AvatarView avatar = 1;
}
