syntax = "proto3";

package com.dating.user.profile.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.dating.user.grpc.proto";
option java_outer_classname = "UserProfileServiceProto";

// 用户资料 gRPC 服务。
service UserProfileService {
  // 查询本人资料。
  rpc GetSelfProfile(GetSelfProfileRequest) returns (GetSelfProfileResponse);
  // 更新本人基础资料，不处理头像/相册。
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // 绑定头像或相册 object key，不上传文件。
  rpc BindUserPhoto(BindUserPhotoRequest) returns (BindUserPhotoResponse);
  // 查询用户照片列表。
  rpc ListUserPhotos(ListUserPhotosRequest) returns (ListUserPhotosResponse);
  // 批量查询用户基础资料，供下游服务展示。
  rpc BatchGetBasicProfiles(BatchGetBasicProfilesRequest) returns (BatchGetBasicProfilesResponse);
  // 批量查询用户推荐展示资料，不做推荐算法。
  rpc BatchGetRecommendProfiles(BatchGetRecommendProfilesRequest) returns (BatchGetRecommendProfilesResponse);
  // 批量检查用户是否可用。
  rpc CheckUserAvailable(CheckUserAvailableRequest) returns (CheckUserAvailableResponse);
}

// 查询本人资料请求。
message GetSelfProfileRequest {
  int64 user_id = 1;
}

// 用户资料详情，不含敏感字段。
message UserProfileDetail {
  int64 user_id = 1;
  string user_type = 2;
  string account_status = 3;
  string profile_status = 4;
  string nickname = 5;
  string gender = 6;
  string birth_date = 7;
  string country_code = 8;
  string city_code = 9;
  repeated string language_codes = 10;
  string bio = 11;
  string avatar_key = 12;
  repeated string interests = 13;
  int32 profile_score = 14;
  int32 profile_completed = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}

// 查询本人资料响应。
message GetSelfProfileResponse {
  UserProfileDetail profile = 1;
}

// 更新资料请求，不包含 avatar_key。
message UpdateProfileRequest {
  int64 user_id = 1;
  string nickname = 2;
  string gender = 3;
  string birth_date = 4;
  string country_code = 5;
  string city_code = 6;
  repeated string language_codes = 7;
  string bio = 8;
  repeated string interests = 9;
}

// 更新资料响应。
message UpdateProfileResponse {
  UserProfileDetail profile = 1;
}

// 绑定照片请求。
message BindUserPhotoRequest {
  int64 user_id = 1;
  string photo_type = 2;
  string object_key = 3;
  int32 sort_order = 4;
}

// 绑定照片响应。
message BindUserPhotoResponse {
  UserPhoto photo = 1;
  string avatar_key = 2;
  string profile_status = 3;
}

// 查询照片列表请求。
message ListUserPhotosRequest {
  int64 user_id = 1;
  string photo_type = 2;
}

// 查询照片列表响应。
message ListUserPhotosResponse {
  repeated UserPhoto photos = 1;
}

// 用户照片信息，仅 object key，不含完整 URL。
message UserPhoto {
  int64 photo_id = 1;
  int64 user_id = 2;
  string photo_type = 3;
  string object_key = 4;
  int32 sort_order = 5;
  string review_status = 6;
  int32 enabled = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// 批量查询基础资料请求。
message BatchGetBasicProfilesRequest {
  repeated int64 user_ids = 1;
  bool include_unavailable = 2;
}

// 批量查询基础资料响应。
message BatchGetBasicProfilesResponse {
  repeated BasicUserProfile profiles = 1;
}

// 用户基础资料，供列表/卡片展示。
message BasicUserProfile {
  int64 user_id = 1;
  string nickname = 2;
  string gender = 3;
  string city_code = 4;
  string avatar_key = 5;
  string profile_status = 6;
  string account_status = 7;
  bool available = 8;
  string unavailable_reason = 9;
}

// 批量查询推荐展示资料请求。
message BatchGetRecommendProfilesRequest {
  repeated int64 user_ids = 1;
  bool include_unavailable = 2;
}

// 批量查询推荐展示资料响应。
message BatchGetRecommendProfilesResponse {
  repeated RecommendUserProfile profiles = 1;
}

// 用户推荐展示资料，不含敏感字段。
message RecommendUserProfile {
  int64 user_id = 1;
  string user_type = 2;
  string gender = 3;
  string birth_date = 4;
  string country_code = 5;
  string city_code = 6;
  repeated string language_codes = 7;
  repeated string interests = 8;
  string bio = 9;
  string avatar_key = 10;
  int32 profile_score = 11;
  int32 profile_completed = 12;
  string profile_status = 13;
  string account_status = 14;
  bool available = 15;
  string unavailable_reason = 16;
}

// 批量检查用户可用性请求。
message CheckUserAvailableRequest {
  repeated int64 user_ids = 1;
}

// 批量检查用户可用性响应。
message CheckUserAvailableResponse {
  repeated UserAvailableResult results = 1;
}

// 单个用户可用性结果。
message UserAvailableResult {
  int64 user_id = 1;
  bool available = 2;
  string account_status = 3;
  string profile_status = 4;
  string reason = 5;
}
