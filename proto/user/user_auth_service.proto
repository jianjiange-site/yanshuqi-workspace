syntax = "proto3";

package com.dating.user.auth.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.dating.user.grpc.proto";
option java_outer_classname = "UserAuthServiceProto";

// 用户认证 gRPC 服务。
service UserAuthService {
  // 注册新用户，初始化 users / auth / profile / settings 四张表基础数据。
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // 校验登录凭证与密码，更新设备与最近登录时间，不签发 JWT。
  rpc VerifyLogin(VerifyLoginRequest) returns (VerifyLoginResponse);
  // 设备匿名登录：解析或创建设备身份用户，不签发 JWT。
  rpc ResolveOrCreateDeviceUser(ResolveOrCreateDeviceUserRequest) returns (ResolveOrCreateLoginUserResponse);
  // 手机号登录：解析或创建手机号身份用户，不校验真实短信，不签发 JWT。
  rpc ResolveOrCreatePhoneUser(ResolveOrCreatePhoneUserRequest) returns (ResolveOrCreateLoginUserResponse);
  // 三方登录：解析或创建三方身份用户，不校验真实 OAuth，不签发 JWT。
  rpc ResolveOrCreateThirdPartyUser(ResolveOrCreateThirdPartyUserRequest) returns (ResolveOrCreateLoginUserResponse);
}

// 注册请求。
message RegisterRequest {
  string identity_type = 1;
  string identity_value = 2;
  string password = 3;
  string user_type = 4;
  string register_source = 5;
  DeviceInfo device_info = 6;
}

// 登录校验请求。
message VerifyLoginRequest {
  string identity_type = 1;
  string identity_value = 2;
  string password = 3;
  DeviceInfo device_info = 4;
}

// 设备匿名登录请求。
message ResolveOrCreateDeviceUserRequest {
  string device_id = 1;
  string platform = 2;
  string device_model = 3;
  string os_version = 4;
  string app_version = 5;
  string push_token = 6;
}

// 手机号登录请求。
message ResolveOrCreatePhoneUserRequest {
  string phone = 1;
  string sms_code = 2;
  string device_id = 3;
  string platform = 4;
  string device_model = 5;
  string os_version = 6;
  string app_version = 7;
  string push_token = 8;
}

// 三方登录请求。
message ResolveOrCreateThirdPartyUserRequest {
  int32 third_party_platform = 1;
  string id_token = 2;
  string google_email = 3;
  string device_id = 4;
  string platform = 5;
  string device_model = 6;
  string os_version = 7;
  string app_version = 8;
  string push_token = 9;
}

// 设备信息。
message DeviceInfo {
  string platform = 1;
  string device_fingerprint = 2;
  string push_token = 3;
  string app_version = 4;
}

// 注册响应，不包含 token 与敏感字段。
message RegisterResponse {
  int64 user_id = 1;
  string account_status = 2;
  string profile_status = 3;
  int32 token_version = 4;
}

// 登录校验响应，供 gateway 签发 JWT，不包含 token 与敏感字段。
message VerifyLoginResponse {
  int64 user_id = 1;
  string account_status = 2;
  string profile_status = 3;
  int32 token_version = 4;
  google.protobuf.Timestamp last_login_at = 5;
}

// 登录来源解析或创建用户统一响应，供 gateway 签发 JWT，不包含 token 与敏感字段。
message ResolveOrCreateLoginUserResponse {
  int64 user_id = 1;
  bool newly_created = 2;
  bool pending = 3;
  string account_status = 4;
  string profile_status = 5;
  int32 token_version = 6;
  google.protobuf.Timestamp last_login_at = 7;
}
