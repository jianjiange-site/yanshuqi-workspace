syntax = "proto3";

package com.dating.post.v1;

option java_multiple_files = true;
option java_package = "com.dating.post.grpc.proto";
option java_outer_classname = "PostServiceProto";

// Post 域 gRPC 服务：发帖、互动、Feed（阶段 1 mock，阶段 2+ 替换为真实业务逻辑）。
service PostService {
  // 创建帖子；调用方 userId 来自 Metadata x-user-id，不在 request 中传递。
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  // 查询帖子详情。
  rpc GetPostDetail(GetPostDetailRequest) returns (GetPostDetailResponse);
  // 查询指定用户的帖子列表（游标分页）。
  rpc ListUserPosts(ListUserPostsRequest) returns (ListUserPostsResponse);
  // 点赞或取消点赞。
  rpc ActionLike(ActionLikeRequest) returns (ActionLikeResponse);
  // 创建评论；调用方 userId 来自 Metadata x-user-id。
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  // 查询帖子评论列表（游标分页）。
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  // 删除评论；调用方 userId 来自 Metadata x-user-id。
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
  // 删除帖子；调用方 userId 来自 Metadata x-user-id。
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
  // 获取推荐 Feed（游标分页）；调用方 userId 来自 Metadata x-user-id。
  rpc GetRecommendFeed(GetRecommendFeedRequest) returns (GetRecommendFeedResponse);
}

// 帖子展示信息。
message PostInfo {
  int64 post_id = 1;
  int64 user_id = 2;
  string content = 3;
  repeated string image_keys = 4;
  int32 like_count = 5;
  int32 comment_count = 6;
  bool is_liked = 7;
  int64 created_at_seconds = 8;
}

// 评论展示信息。
message CommentInfo {
  int64 comment_id = 1;
  int64 post_id = 2;
  int64 user_id = 3;
  string content = 4;
  int64 created_at_seconds = 5;
}

// 创建帖子请求。
message CreatePostRequest {
  string content = 1;
  repeated string image_keys = 2;
}

// 创建帖子响应。
message CreatePostResponse {
  int32 code = 1;
  string message = 2;
  int64 post_id = 3;
}

// 查询帖子详情请求。
message GetPostDetailRequest {
  int64 post_id = 1;
}

// 查询帖子详情响应。
message GetPostDetailResponse {
  int32 code = 1;
  string message = 2;
  PostInfo post = 3;
}

// 查询用户帖子列表请求。
message ListUserPostsRequest {
  int64 user_id = 1;
  string cursor = 2;
  int32 page_size = 3;
}

// 查询用户帖子列表响应。
message ListUserPostsResponse {
  int32 code = 1;
  string message = 2;
  repeated PostInfo items = 3;
  string next_cursor = 4;
  bool has_more = 5;
}

// 点赞动作请求。
message ActionLikeRequest {
  int64 post_id = 1;
  bool like = 2;
}

// 点赞动作响应。
message ActionLikeResponse {
  int32 code = 1;
  string message = 2;
  bool success = 3;
}

// 创建评论请求。
message CreateCommentRequest {
  int64 post_id = 1;
  string content = 2;
}

// 创建评论响应。
message CreateCommentResponse {
  int32 code = 1;
  string message = 2;
  int64 comment_id = 3;
}

// 查询评论列表请求。
message ListCommentsRequest {
  int64 post_id = 1;
  string cursor = 2;
  int32 page_size = 3;
}

// 查询评论列表响应。
message ListCommentsResponse {
  int32 code = 1;
  string message = 2;
  repeated CommentInfo items = 3;
  string next_cursor = 4;
  bool has_more = 5;
}

// 删除评论请求。
message DeleteCommentRequest {
  int64 comment_id = 1;
}

// 删除评论响应。
message DeleteCommentResponse {
  int32 code = 1;
  string message = 2;
  bool success = 3;
}

// 删除帖子请求。
message DeletePostRequest {
  int64 post_id = 1;
}

// 删除帖子响应。
message DeletePostResponse {
  int32 code = 1;
  string message = 2;
  bool success = 3;
}

// 推荐 Feed 请求。
message GetRecommendFeedRequest {
  string cursor = 1;
  int32 page_size = 2;
}

// 推荐 Feed 响应。
message GetRecommendFeedResponse {
  int32 code = 1;
  string message = 2;
  repeated PostInfo items = 3;
  string next_cursor = 4;
  bool has_more = 5;
}
