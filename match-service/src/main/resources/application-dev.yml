server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: match-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE:dating_dev_yanshuqi}?currentSchema=match_center&stringtype=unspecified
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-init-sql: SET TIME ZONE 'UTC'
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:1}
      timeout: 3s
  flyway:
    enabled: true
    schemas: match_center
    table: flyway_history_match
    baseline-on-migrate: true

app:
  cache:
    key-prefix: ${REDIS_KEY_PREFIX:yanshuqi}
  service:
    name: match-service
    redis-key-suffix: match
  grpc:
    port: 9092
  infra:
    redis-test-key: ${REDIS_KEY_PREFIX:yanshuqi}:match:infra:ping
    redis-test-ttl-seconds: 60
  match:
    dh-delayed-match-min-ms: 15000
    dh-delayed-match-max-ms: 120000
    feed:
      queue-size: 240
      cold-start-bh-ratio: 0.20
      queue-ttl-days: 7
    d1:
      bh-ratio: 0.40
      preference-enabled: true
      preference-offset: 0.20
      min-preference-samples: 10
      preference-window-days: 30
    score:
      mutual-like-bonus: 0.20
      new-bh-bonus: 0.20
      new-bh-window-days: 3
    super-hi-coin-price: 100
    external:
      user-client-mode: mock
      payment-client-mode: mock
      im-client-mode: mock
    grpc:
      user-service-target: static://127.0.0.1:9091
      payment-service-target: static://127.0.0.1:9095
      im-service-target: static://127.0.0.1:9093

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:dating-yanshuqi}
  region: ${MINIO_REGION:us-east-1}
  path-style-access: ${MINIO_PATH_STYLE_ACCESS:true}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:}
  access-key: ${ROCKETMQ_ACCESS_KEY:}
  secret-key: ${ROCKETMQ_SECRET_KEY:}
  topic-prefix: ${ROCKETMQ_TOPIC_PREFIX:yanshuqi_dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true

grpc:
  server:
    port: ${MATCH_GRPC_PORT:9092}
  client:
    user-service:
      address: static://127.0.0.1:9091
      negotiation-type: plaintext
    payment-service:
      address: static://127.0.0.1:9095
      negotiation-type: plaintext
    im-service:
      address: static://127.0.0.1:9093
      negotiation-type: plaintext

logging:
  level:
    root: INFO

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
