[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chat"
version = "0.1.0"
description = "Dating App AI Chat service skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "grpcio>=1.68.0",
    "grpcio-health-checking>=1.68.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.0",
    "minio>=7.2.12",
    "nacos-sdk-python>=0.1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
